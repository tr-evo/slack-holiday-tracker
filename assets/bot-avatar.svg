<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="512" height="512" shape-rendering="crispEdges">
  <!-- Sky gradient (top to bottom) -->
  <rect y="0"  width="16" height="1" fill="#2B1055"/>
  <rect y="1"  width="16" height="1" fill="#3D1A6E"/>
  <rect y="2"  width="16" height="1" fill="#6B2FA0"/>
  <rect y="3"  width="16" height="1" fill="#9B3DB5"/>
  <rect y="4"  width="16" height="1" fill="#D4508A"/>
  <rect y="5"  width="16" height="1" fill="#E8725C"/>
  <rect y="6"  width="16" height="1" fill="#F4A261"/>
  <rect y="7"  width="16" height="1" fill="#F6D365"/>

  <!-- Sun -->
  <rect x="5"  y="4" width="6" height="1" fill="#F6D365"/>
  <rect x="4"  y="5" width="8" height="1" fill="#FFEAA7"/>
  <rect x="4"  y="6" width="8" height="1" fill="#F6D365"/>
  <rect x="5"  y="7" width="6" height="1" fill="#FDA085"/>

  <!-- Water -->
  <rect y="8"  width="16" height="1" fill="#1B4F72"/>
  <rect y="9"  width="16" height="1" fill="#1A5276"/>
  <rect y="10" width="16" height="1" fill="#154360"/>
  <rect y="11" width="16" height="1" fill="#1B2631"/>
  <rect y="12" width="16" height="1" fill="#17202A"/>
  <rect y="13" width="16" height="1" fill="#0D1117"/>
  <rect y="14" width="16" height="1" fill="#0D1117"/>
  <rect y="15" width="16" height="1" fill="#0D1117"/>

  <!-- Sun reflection on water -->
  <rect x="6" y="8"  width="4" height="1" fill="#F4A261" opacity="0.5"/>
  <rect x="7" y="9"  width="2" height="1" fill="#F6D365" opacity="0.3"/>
  <rect x="6" y="10" width="4" height="1" fill="#F4A261" opacity="0.15"/>

  <!-- Palm tree trunk -->
  <rect x="3" y="6"  width="1" height="1" fill="#3D2B1F"/>
  <rect x="3" y="7"  width="1" height="1" fill="#4E3524"/>
  <rect x="3" y="8"  width="1" height="1" fill="#3D2B1F"/>
  <rect x="3" y="9"  width="1" height="1" fill="#4E3524"/>
  <rect x="2" y="10" width="1" height="1" fill="#3D2B1F"/>
  <rect x="2" y="11" width="1" height="1" fill="#4E3524"/>
  <rect x="2" y="12" width="1" height="1" fill="#3D2B1F"/>

  <!-- Palm leaves -->
  <rect x="1" y="4" width="2" height="1" fill="#1E5631"/>
  <rect x="4" y="4" width="3" height="1" fill="#1E5631"/>
  <rect x="1" y="5" width="1" height="1" fill="#2D7D46"/>
  <rect x="2" y="5" width="3" height="1" fill="#1E5631"/>
  <rect x="5" y="5" width="2" height="1" fill="#2D7D46"/>
  <rect x="3" y="3" width="2" height="1" fill="#2D7D46"/>
  <rect x="0" y="5" width="1" height="1" fill="#2D7D46"/>
  <rect x="7" y="5" width="1" height="1" fill="#1E5631"/>
</svg>
